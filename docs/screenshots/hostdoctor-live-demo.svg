<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="542" viewBox="0 0 1120 542" role="img" aria-labelledby="title desc">
<title id="title">HostDoctor actual command-line output</title>
<desc id="desc">A terminal-style visual showing HostDoctor running on a GitHub-hosted Ubuntu runner. The report omits hostnames, addresses, paths, process details, and failed service names.</desc>
<rect width="1120" height="542" rx="20" fill="#0b1020"/>
<rect x="1" y="1" width="1118" height="540" rx="19" fill="none" stroke="#26324a" stroke-width="2"/>
<rect x="0" y="0" width="1120" height="11" rx="5" fill="#42d3a5"/>
<text x="40" y="55" fill="#f3f6fc" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">HostDoctor</text>
<text x="40" y="83" fill="#aab7ca" font-family="Segoe UI, Arial, sans-serif" font-size="16">Privacy-first Linux host snapshot</text>
<rect x="40" y="102" width="232" height="24" rx="12" fill="#143b35"/>
<text x="56" y="119" fill="#7ee0b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">ACTUAL PROGRAM OUTPUT</text>
<rect x="24" y="146" width="1072" height="338" rx="12" fill="#090d17" stroke="#202b40"/>
<circle cx="49" cy="172" r="6" fill="#ff6c67"/><circle cx="70" cy="172" r="6" fill="#ffc857"/><circle cx="91" cy="172" r="6" fill="#4fd1a1"/>
<text x="112" y="177" fill="#71809a" font-family="Segoe UI, Arial, sans-serif" font-size="12">GitHub-hosted Ubuntu runner</text>
<line x1="40" y1="198" x2="1080" y2="198" stroke="#1c2739"/>
<text x="48" y="234" fill="#7ee0b8" font-family="Consolas, 'Courier New', monospace" font-size="15">$ hostdoctor collect --format text</text><text x="48" y="258" fill="#d5deeb" font-family="Consolas, 'Courier New', monospace" font-size="15">HostDoctor snapshot</text><text x="48" y="282" fill="#d5deeb" font-family="Consolas, 'Courier New', monospace" font-size="15">- Memory: 94.0% available (ok)</text><text x="48" y="306" fill="#d5deeb" font-family="Consolas, 'Courier New', monospace" font-size="15">- Load Average: 0.53 / 0.22 / 0.08 across 4 CPU(s) (ok)</text><text x="48" y="330" fill="#d5deeb" font-family="Consolas, 'Courier New', monospace" font-size="15">- Root Filesystem: 60.8% free (ok)</text><text x="48" y="354" fill="#d5deeb" font-family="Consolas, 'Courier New', monospace" font-size="15">- Root Inodes: 94.5% free (ok)</text><text x="48" y="378" fill="#d5deeb" font-family="Consolas, 'Courier New', monospace" font-size="15">- Listening Sockets: 9 TCP/UDP listening socket(s); addresses omitted (ok)</text><text x="48" y="402" fill="#d5deeb" font-family="Consolas, 'Courier New', monospace" font-size="15">- Systemd Services: 0 failed service unit(s); names omitted (ok)</text><text x="48" y="426" fill="#d5deeb" font-family="Consolas, 'Courier New', monospace" font-size="15">Summary: 6 ok, 0 warning, 0 unknown</text>
<text x="40" y="515" fill="#71809a" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.8">REAL CI RUN  |  ANONYMOUS RESOURCE METRICS  |  VALUES VARY BY RUN</text>
</svg>
